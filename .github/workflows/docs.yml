name: Build Rustdoc

# `master` is this repository's default branch and `main` has never existed, so
# the branch half of this trigger matched nothing until `master` was added: only
# the tag push rebuilt the docs. Both names are listed so the branch build
# survives a rename in either direction.
#
# Deliberately NOT `branches: ['**']`, unlike `ci.yml`. The last step here
# dispatches a rebuild of the public site, so widening this to every branch
# would republish moqtap.dev from whatever unmerged branch was pushed last.
# Rustdoc *correctness* on a feature branch is covered without that: `ci.yml`'s
# `doc` job runs `cargo doc --workspace --no-deps` under `RUSTDOCFLAGS=-D
# warnings` on every branch, which is the half that can fail. This workflow only
# adds publication.
on:
  push:
    tags:
      - "*-v*"
    branches: [main, master]

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo doc --workspace --no-deps --document-private-items
      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: target/doc/
      - name: Trigger site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          repository: moqtap/site
          event-type: rustdoc-updated
          client-payload: '{"tag": "${{ github.ref_name }}"}'
