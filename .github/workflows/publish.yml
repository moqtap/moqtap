name: Publish Crate

# One entry per publishable crate, and a tag prefix that is missing here does
# not publish — the push appears to work, produces no job at all, and is
# indistinguishable from a publish that succeeded. Add the prefix in the same
# change that adds the crate.
#
# There is deliberately no `cli-v*` prefix. That tool is not a crate in this
# workspace and is not distributed through crates.io, so a prefix for it here
# would be a publish trigger aimed at something that must never be published.
# An earlier revision kept it on the argument that a prefix with no crate
# fails loudly and is therefore the safe direction; that holds only while the
# crate is merely missing, and it stopped holding once the answer became that
# it must not be here at all.
on:
  push:
    tags:
      - "codec-v*"
      - "trace-v*"
      - "client-v*"
      - "proxy-v*"
      - "netem-v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publishing is irreversible: crates.io permits a yank but never a replace.
  # So the whole of CI runs first, at the tagged commit, and `publish` does not
  # start unless it is green. Before this, `ci.yml` and `publish.yml` both
  # triggered on a tag push and raced — a crate could reach the registry while
  # its own test matrix was still running, or after it had gone red.
  #
  # `ci.yml` therefore no longer triggers on tags itself. It is reached here
  # instead, so a tag produces exactly one CI run rather than two.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Parse tag
        id: parse
        run: |
          set -euo pipefail
          # Tag format: <short>-v<version>, e.g. codec-v0.1.0.
          #
          # An explicit table, not `moqtap-${SHORT}`. That concatenation was
          # right only while every crate carried the project's prefix, and it
          # silently stopped being right the moment one did not: `netem-v0.1.0`
          # would have resolved to a `moqtap-netem` that does not exist. A
          # table also makes the unmapped case reachable, which string
          # concatenation never is — every prefix produces *a* name, just not
          # necessarily one in this workspace.
          TAG="${GITHUB_REF_NAME}"
          SHORT="${TAG%-v*}"
          VERSION="${TAG#*-v}"
          case "$SHORT" in
            codec)  CRATE="moqtap-codec"  ;;
            trace)  CRATE="moqtap-trace"  ;;
            client) CRATE="moqtap-client" ;;
            proxy)  CRATE="moqtap-proxy"  ;;
            netem)  CRATE="quinn-netem"   ;;
            *)
              echo "::error::tag prefix '${SHORT}' maps to no crate. Add it to the case in publish.yml and to the tag list above — both, or the tag fires nothing."
              exit 1 ;;
          esac
          echo "crate=${CRATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${CRATE} v${VERSION}"

      - name: Verify Cargo.toml version matches tag
        run: |
          CRATE="${{ steps.parse.outputs.crate }}"
          VERSION="${{ steps.parse.outputs.version }}"
          CARGO_VERSION=$(grep '^version' "crates/${CRATE}/Cargo.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish ${{ steps.parse.outputs.crate }}
        run: cargo publish -p ${{ steps.parse.outputs.crate }} --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
