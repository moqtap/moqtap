[workspace]
resolver = "2"
members = [
    "crates/moqtap-codec",
    "crates/moqtap-trace",
    "crates/moqtap-client",
    "crates/moqtap-proxy",
    "crates/quinn-netem",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/moqtap/moqtap"
homepage = "https://github.com/moqtap/moqtap"
keywords = ["moqt", "quic", "streaming", "media", "protocol"]
categories = ["network-programming"]

# Every `version` here must equal the version in the member's own manifest. A
# path dependency resolves by path inside the workspace, so a wrong number is
# invisible to `cargo build`, `cargo test` and `cargo clippy` alike — and then
# `cargo publish` emits it into the registry entry, where it is a requirement
# against a version that may not exist. `moqtap-trace` sat at `0.2.0` against a
# `0.1.0` crate for the whole of the project's history without one gate
# noticing, because nothing consumed the pin.
[workspace.dependencies]
moqtap-codec = { path = "crates/moqtap-codec", version = "0.6.0", default-features = false }
wtransport = { version = "0.7", features = ["dangerous-configuration", "quinn"] }
moqtap-trace = { path = "crates/moqtap-trace", version = "0.3.0" }
# `default-features = false` is load-bearing: cargo IGNORES a member manifest's
# `default-features = false` on a `workspace = true` dependency unless the
# workspace entry carries it too, warning only at the manifest level — which
# `RUSTFLAGS = "-D warnings"` never sees. Without it every reduced-draft
# `moqtap-proxy` build silently resolves all fourteen drafts and CI's
# single-draft rows pass by not checking anything.
moqtap-client = { path = "crates/moqtap-client", version = "0.6.0", default-features = false }
moqtap-proxy = { path = "crates/moqtap-proxy", version = "0.6.0" }
# No `default-features = false`: this crate declares no `default` key at all, so
# every feature it has is opt-in at the member manifest.
quinn-netem = { path = "crates/quinn-netem", version = "0.1.3" }
bytes = "1"
thiserror = "2"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ciborium = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }

# `wtransport` 0.7.2 with one patch applied: the CONNECT response survives into
# the `Connection` instead of being parsed and dropped. `vendor/wtransport/PATCH.md`
# has the diff and the reasoning; the short version is that `WT-Protocol` — the
# server's half of WebTransport version negotiation, and the only channel drafts
# 15 through 20 have over that transport — arrives in that response and nowhere
# else.
#
# A `[patch]` section applies to whatever workspace is being *built*, and is not
# carried into a published crate. So `moqtap-client` may only reach this API
# behind its `wt-protocol` feature, which is off by default and documented as
# requiring the patch; the crates.io build of this crate is unaffected.
#
# A `[patch]` section is not inherited through a path dependency either, so a
# workspace depending on this one by path carries its own copy pointed here. The
# `cli` repository does not and must not: its manifest names published versions
# deliberately, and overrides them in a gitignored `.cargo/config.toml`, which
# is where a `wtransport` line belongs there.
[patch.crates-io]
wtransport = { path = "vendor/wtransport" }

[profile.release]
lto = true
codegen-units = 1
strip = true
