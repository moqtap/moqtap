# The third-party peer for `tests/interop_moq_rs.rs`: `moq-relay-ietf`, from
# github.com/cloudflare/moq-rs. It is a separate codebase with its own MoQT
# encoder and decoder, and it is what the public Cloudflare relays run — so a
# green run here is the same two implementations agreeing that the directory
# measures. Nothing in the image is built from this workspace, which is the
# whole point; see that file's header for what the arrangement buys.
#
# Built from source rather than pulled. That project publishes no container
# image: its release workflow builds binaries and its own `docker-compose.yml`
# names a `moq-dir` binary that is not a workspace member, so neither is a route
# in. `just interop-up` builds it, taking the git URL as a Docker build context
# so there is no clone step anywhere.
#
# The build is a `docker build` in the recipe rather than a `build:` key here,
# and that is not a preference. Compose resolves a `build.context` as a
# filesystem path even when it is a URL — measured: it reports
# `failed to evaluate path "https://github.com/cloudflare/moq-rs.git#main"`
# against this repository's own directory. The Docker CLI handles the same
# string, prints the commit it resolved, and tags the result, which this file
# then names.
#
# The ref is `main`, not a commit, and that is deliberate. An interop suite
# pinned to one revision stops noticing when the other implementation changes,
# which is the only failure it exists to catch. The cost is that a red run can
# be either side's regression, so `just interop-up` prints the ref it resolved:
# set MOQ_RELAY_REF to a commit SHA to re-run against the exact source a
# previous run used and settle which side moved. Known good: main at
# ab1cfffaf988d11c624d1b73b7e6c72e004aed04 (2026-08-29).
#
# `main` targets draft-16, which is what the test speaks. The project keeps
# `draft-ietf-moq-transport-14` in maintenance and does draft-18 work on
# `draft-18-dev`; either is reachable through MOQ_RELAY_REF, but the test's
# draft would have to move with it.

services:
  relay:
    image: moqtap-interop-relay:${MOQ_RELAY_REF:-main}
    container_name: moqtap-interop-relay
    # The image's own `CMD` names `moq-relay`, which is not what the binary is
    # called — the container exits 127 on it. The relay is `moq-relay-ietf`.
    entrypoint: /usr/local/bin/moq-relay-ietf
    # Loopback-scoped, not 0.0.0.0. This relay has no authentication of any
    # kind — there is no flag to add one — so it must not be reachable from the
    # network the developer is on.
    ports:
      - "127.0.0.1:4443:4443/udp"
    environment:
      # The relay logs the negotiated ALPN and every control message it decodes
      # at debug. When a run goes red this is the other half of the evidence:
      # the test says what the proxy reported, `just interop-logs` says what a
      # foreign decoder made of the same bytes.
      RUST_LOG: ${MOQ_RELAY_LOG:-debug}
    volumes:
      # Generated by `just interop-up` and gitignored. There is no
      # `--tls-generate` here — the relay refuses to start without a key — so
      # the certificate is made outside and mounted in. The proxy's upstream leg
      # runs with `skip_upstream_cert_verify`, which `common::session_config`
      # already sets, so nothing pins or checks it.
      - ./certs:/etc/tls:ro
    command:
      - --bind
      - "[::]:4443"
      - --tls-cert
      - /etc/tls/localhost.crt
      - --tls-key
      - /etc/tls/localhost.key
