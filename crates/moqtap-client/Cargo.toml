[package]
name = "moqtap-client"
description = "MoQT client library — QUIC transport, endpoint state machine, subscribe/fetch/namespace flows"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# `tests/` is the conformance suite: 130 files that drive a loopback QUIC peer
# across fourteen drafts, and roughly six megabytes of the package for a
# consumer who is not developing this crate. The unit tests inside `src/` are
# packaged as usual, which is why `rcgen` remains a dev-dependency.
exclude = ["tests/"]

[features]
default = ["all-drafts"]
webtransport = ["wtransport"]

# Read back the CONNECT response — `Transport::wt_protocol`, the server's half
# of WebTransport version negotiation from draft-15 on.
#
# **Requires a patched `wtransport`** and does not build without one: upstream
# 0.7 parses the CONNECT response and drops it, so there is no API to call. The
# patch is `moqtap/vendor/wtransport`, applied by the `[patch.crates-io]`
# section in the workspace manifest; `vendor/wtransport/PATCH.md` explains it
# and is where an upstream release would retire it.
#
# Off by default, and left out of `all-drafts`, precisely so that the crates.io
# build of this crate is unaffected by a patch that only exists in this
# repository. A consumer who enables it without the patch gets a compile error
# rather than a silently-absent answer, which is the right way round: the
# feature's whole content is a question this stack can otherwise not ask.
wt-protocol = ["webtransport"]

draft07 = ["moqtap-codec/draft07"]
draft08 = ["moqtap-codec/draft08"]
draft09 = ["moqtap-codec/draft09"]
draft10 = ["moqtap-codec/draft10"]
draft11 = ["moqtap-codec/draft11"]
draft12 = ["moqtap-codec/draft12"]
draft13 = ["moqtap-codec/draft13"]
draft14 = ["moqtap-codec/draft14"]
draft15 = ["moqtap-codec/draft15"]
draft16 = ["moqtap-codec/draft16"]
draft17 = ["moqtap-codec/draft17"]
draft18 = ["moqtap-codec/draft18"]
draft19 = ["moqtap-codec/draft19"]
draft20 = ["moqtap-codec/draft20"]
all-drafts = [
    "draft07",
    "draft08",
    "draft09",
    "draft10",
    "draft11",
    "draft12",
    "draft13",
    "draft14",
    "draft15",
    "draft16",
    "draft17",
    "draft18",
    "draft19",
    "draft20",
    "moqtap-codec/all-drafts",
]

[dependencies]
moqtap-codec = { workspace = true, default-features = false }
bytes = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
wtransport = { workspace = true, optional = true }

[dev-dependencies]
rcgen = "0.14"
