[package]
name = "moqtap-trace"
description = "MoQT session tracing — .moqtrace file format, event capture, and session metrics"
# 0.3.0, not 0.2.1, for the same reason 0.2.0 was not 0.1.1: `TraceEvent` gained
# a public field (`extra`, which is how an unrecognised key survives a
# read-modify-write), and a struct literal downstream stops compiling. Under
# Cargo's 0.x rules the minor position is the major position, so a patch bump
# would hand that break to every current consumer of `^0.2.0`.
#
# 0.2.0 was itself: `EventData` gained variants and became non-exhaustive, and
# `TraceEvent` and `TraceHeader` gained public fields.
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
ciborium = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
